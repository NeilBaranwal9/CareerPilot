# Recruiting Platform Configuration — Example / Template
# Copy this file to config.yaml and fill in your personal details.
#   cp config.example.yaml config.yaml
# config.yaml is git-ignored so your preferences stay private.
# Every section below the "Scoring" block is optional; defaults are used when omitted.

# ──────────────────────────────────────────────────────────
# Your Identity  (used for email sign-offs & resume fallback)
# ──────────────────────────────────────────────────────────
user_identity:
  name: "Jane Doe"
  email: "jane.doe@example.com"
  linkedin_url: "https://www.linkedin.com/in/jane-doe/"
  github_url: "https://github.com/jane-doe"
  website_url: "https://janedoe.dev"

# ──────────────────────────────────────────────────────────
# Job Search Preferences
# ──────────────────────────────────────────────────────────
job_preferences:
  roles:
    - "Software Engineer"
    - "Software Developer"
    - "Backend Engineer"
    - "Backend Developer"
    - "Python Developer"
    - "Full Stack Engineer"
    - "AI Engineer"
    - "Entry Level"
    - "Graduate"
    - "SDE-1"
  geographies:
    - "India"
    - "Remote"
  remote_only: false
  salary_range:
    min_lpa: 10.0   # Adjust to your expectations
    max_lpa: 25.0
  company_size:
    min_employees: 100
    max_employees: 1000
  experience_years_max: 1.0
  # Companies without a matching public opening: see discovery.mode below (hybrid / company_outreach).

# ──────────────────────────────────────────────────────────
# Exclusions
# ──────────────────────────────────────────────────────────
exclusions:
  companies:
    - "Company You Dislike"
  keywords:
    - "Unpaid"
    - "Staffing Agency"
    - "Recruitment Agency"
    - "Contract"
  emails: []    # never email these addresses
  domains: []   # never email anyone at these domains

# ──────────────────────────────────────────────────────────
# Pipeline & Email Settings
# ──────────────────────────────────────────────────────────
pipeline:
  daily_draft_limit: 20
  research_depth: "detailed"
  cache_lifetime_seconds: 86400
  retry_limits: 3
  generate_resume: false   # If false, uses the best pre-built resume variant; if true, the LLM tailors bullets/order too
  # Legacy single-resume fallback (used only when none of the `resumes:` variants below exist on disk)
  ai_resume_path: "/mnt/bridge/dev/personal/resume/resume_vineet_kushwaha_ai.typ"
  base_resume_path: "/mnt/bridge/dev/personal/resume/resume_vineet_kushwaha.typ"   # Path to YOUR Typst base resume
  generated_resumes_dir: "/mnt/bridge/dev/personal/resume/generated"
  db_path: "data/platform.db"
  research_cache_days: 7   # company research, contacts, jobs and email patterns are reused for 7 days
  automation: true   # If true, re-enables the scheduled task/timer if disabled; if false, disables it

# ──────────────────────────────────────────────────────────
# LLM Configuration — Groq (OpenAI-compatible, very fast)
# Get a key at https://console.groq.com/keys and either paste it below or set GROQ_API_KEY.
# `recruiting-platform doctor` lists the models enabled for your key.
# ──────────────────────────────────────────────────────────
llm:
  provider: "groq"  # Options: groq, agy_cli, local_agy, openai, anthropic, gemini
  model: "openai/gpt-oss-120b"              # email writing (Groq is used ONLY for writing)
  fast_model: "qwen/qwen3.8-27b"            # follow-ups; also the fallback when the local model is down
  fallback_models:                          # used automatically on long rate limits / decommissioned models
    - "openai/gpt-oss-120b"
    - "llama-3.1-8b-instant"
  api_key: ""        # leave blank to use the GROQ_API_KEY environment variable
  api_url: ""        # default https://api.groq.com/openai/v1
  temperature: 0.2
  max_tokens: 4096
  max_retries: 4
  timeout_seconds: 60

  # --- Hybrid routing: local Ollama for cheap work, Groq only for writing emails ---
  local_provider: "ollama"
  local_model: "qwen3:8b"        # ollama pull qwen3:8b
  local_url: "http://localhost:11434"
  local_num_ctx: 12288          # Ollama's default context is small and silently truncates long prompts
  local_fallback: "premium_fast" # if Ollama is down: use the Groq fast model, but only within the non-email budget
  routing:
    email_generation: "premium"
    email_regeneration: "premium"
    followup_generation: "premium_fast"
    resume_tailoring: "premium"
    default: "local"             # discovery, research, contacts, email finding, scoring, validation, replies
  groq_daily_token_budget: 190000
  groq_reserved_for_emails: 120000

# ──────────────────────────────────────────────────────────
# Gmail API Configuration
# gmail.compose = create drafts & send; gmail.readonly = detect replies/bounces and avoid duplicates.
# After changing scopes run `recruiting-platform auth` again.
# ──────────────────────────────────────────────────────────
gmail:
  credentials_file: "credentials.json"
  token_file: "token.json"
  scopes:
    - "https://www.googleapis.com/auth/gmail.compose"
    - "https://www.googleapis.com/auth/gmail.readonly"

# ──────────────────────────────────────────────────────────
# Opportunity Scoring Weights (sum should ideally be 1.0)
# ──────────────────────────────────────────────────────────
scoring:
  mode: "hybrid"      # hybrid (rules + LLM) | llm | rules
  llm_weight: 0.5     # share of the LLM judgement in hybrid mode
  weights:
    role_match: 0.3
    tech_stack: 0.3
    salary: 0.1
    company_quality: 0.1
    growth: 0.1
    confidence: 0.1
  thresholds:
    minimum_score: 0.60

# ──────────────────────────────────────────────────────────
# Target profile: what a good-fit company looks like for you
# ──────────────────────────────────────────────────────────
target_profile:
  sector_weights:        # your preference order, e.g. Fintech > Trading > AI > generic SWE
    fintech: 1.0
    trading: 0.95
    ai: 0.85
    devtools: 0.7
    saas: 0.65
    generic: 0.5
  allowed_sectors: []    # e.g. ["fintech", "trading"] to reject every other sector outright
  funding_stages: ["seed", "series_a", "series_b", "series_c"]   # [] = any stage
  skills: ["python", "fastapi", "django", "node.js", "typescript", "react", "postgresql", "docker", "gcp", "aws", "redis"]
  min_company_fit: 0.45
  reject_below_fit: true

# ──────────────────────────────────────────────────────────
# Discovery: where companies and jobs come from
# ──────────────────────────────────────────────────────────
discovery:
  # What to do per company (README "Discovery Modes"):
  #   job_search       - only real public openings that match your roles; other companies are skipped (default)
  #   company_outreach - ask companies about current/upcoming internships; a public opening is not required
  #                      (a real opening on the company's careers page/ATS board is still used when one matches)
  #   hybrid           - real openings when they match, otherwise a company-level inquiry (usually the most useful)
  # Job-search queries always come from job_preferences.roles (e.g. "product analyst data analyst"), never a
  # hard-coded "engineer". Leave `mode` unset to let a campaign goal choose it; an explicit value always wins.
  # mode: "job_search"
  # Standing queries re-run by `daily` / `daemon` (continuous discovery). Examples:
  #   - "Fintech companies in India"
  #   - "Series A/B AI startups"
  #   - "Trading companies"
  queries: []
  sources: ["yc", "web_search", "wellfound", "llm", "ats_boards"]
  job_sources: ["ats", "career_page", "wellfound", "indeed", "web_search"]
  allow_linkedin: false   # LinkedIn blocks automated access (HTTP 999); never searched or scraped
  companies_per_run: 20
  max_jobs_per_company: 3
  ats_boards: {}   # e.g. {greenhouse: ["razorpay"], lever: ["cred"], ashby: ["sarvam"]}

# Company-level inquiries (discovery.mode company_outreach / hybrid). They never claim an opening exists.
company_outreach:
  ask_about_openings: true   # ask whether there are current/upcoming internship opportunities in your target areas

# ──────────────────────────────────────────────────────────
# Contacts: who to reach
# ──────────────────────────────────────────────────────────
contacts:
  sources: ["team_page", "blog", "press", "github", "theorg", "crunchbase", "wellfound", "hunter", "apollo"]
  personas: ["engineering_manager", "product_manager", "product_lead", "director_engineering", "head_of_engineering",
             "staff_engineer", "recruiter", "talent_acquisition", "founder"]
  persona_strategy: "auto"        # auto = founders at small startups, EMs/recruiters at bigger companies; ordered = follow list
  max_contacts_per_company: 1     # 2 = e.g. engineering manager AND recruiter (separate threads)
  allow_generic_inbox: true       # fall back to careers@/hiring@ when no person is found

# ──────────────────────────────────────────────────────────
# Email verification
# ──────────────────────────────────────────────────────────
email_verification:
  smtp_check: true        # RCPT TO probe + catch-all detection (needs outbound port 25; see `doctor`)
  smtp_timeout: 8
  smtp_from: ""           # MAIL FROM used for probing (defaults to user_identity.email)
  helo_host: ""
  allow_catch_all: true   # accept the best-evidence address on catch-all domains
  allow_unverified: true  # accept the best-evidence address when SMTP can't answer (blocked port / greylisting)
  min_confidence: 0.3
  max_smtp_probes: 6

# ──────────────────────────────────────────────────────────
# Optional API keys (blank = read env vars HUNTER_API_KEY, APOLLO_API_KEY, GITHUB_TOKEN, SERPER_API_KEY, BRAVE_API_KEY)
# ──────────────────────────────────────────────────────────
api_keys:
  hunter: ""    # emails, company email patterns, verification
  apollo: ""    # people search (titles, LinkedIn), org enrichment (funding, headcount, tech)
  github: ""    # higher GitHub rate limit for org members & commit-email patterns
  serper: ""    # Google results via serper.dev (more reliable than DuckDuckGo)
  brave: ""     # Brave Search API

search:
  provider: "auto"          # auto | duckduckgo | serper | brave
  min_interval_seconds: 2.0   # DuckDuckGo/Yahoo throttle bursts; add a Serper/Brave key for high volume

# ──────────────────────────────────────────────────────────
# Resume variants — chosen per role by explicit rules
# `path` may be a .pdf, .docx, .typ, .md or .txt. Several variants can share ONE PDF and differ only in `focus`
# (with generate_resume: true the LLM tailors that PDF's text with the focus and renders a new one-page PDF;
#  with generate_resume: false the file is attached unchanged).
# A rule matches when every condition it sets matches (each list = "any of"). The highest `priority` match wins;
# with no match the `default: true` variant is used.
# ──────────────────────────────────────────────────────────
resumes:
  - name: "research"
    path: "resumes/my_resume.pdf"
    priority: 40
    focus: "Lead with ML/LLM work and analytical depth; research-style phrasing"
    rules:
      - title_any: ["research", "researcher", "research intern"]
  - name: "aiml"
    path: "resumes/my_resume.pdf"
    priority: 30
    focus: "Lead with LLM pipelines, ML coursework and AI projects"
    rules:
      - title_any: ["ai", "ml", "machine learning", "data scientist", "llm", "genai"]
        title_none: ["research"]
      - sectors: ["ai"]
  - name: "fintech"
    path: "resumes/my_resume.pdf"
    priority: 20
    focus: "Lead with payments/fraud/security projects, reliability and backend APIs"
    rules:
      - sectors: ["fintech", "trading", "insurtech", "crypto"]
  - name: "backend"
    path: "resumes/my_resume.pdf"
    default: true
    focus: "Lead with systems and backend engineering: Rust daemon, APIs, observability"

# Your standout experiences, re-ordered per role (resume tailoring + emails). Tags drive relevance;
# add a one-line `summary` with a concrete result to let emails and follow-ups mention it.
highlights:
  - name: "Jio internship"
    summary: ""
    tags: ["backend", "fintech", "payments", "scale", "systems", "java", "python"]
  - name: "GSIH finalist"
    summary: ""
    tags: ["ai", "ml", "hackathon", "product", "llm"]
  - name: "Team Ignition"
    summary: ""
    tags: ["systems", "embedded", "robotics", "hardware", "c++"]

# ──────────────────────────────────────────────────────────
# Outreach: tone, sending, follow-ups, tracking
# ──────────────────────────────────────────────────────────
outreach:
  min_words: 120   # target length; the checker allows +/-15 words
  max_words: 170
  tone: "warm"                  # formal | warm | concise | enthusiastic | casual
  persona_tones:
    founder: "concise"
    recruiter: "formal"
  auto_send: false              # false = drafts only (you review & send); true = scheduled automatic sending
  daily_send_limit: 20
  min_minutes_between_sends: 4
  send_window:
    timezone: "Asia/Kolkata"
    start_hour: 9
    end_hour: 12
    weekdays_only: true
  followups:                    # follow-up #1 and #2, sent in the same thread if there is no reply
    - after_days: 4
    - after_days: 7
  stop_on_reply: true
  company_cooldown_days: 60     # don't start a new thread with a company contacted recently
  check_gmail_history: true     # skip people you already emailed from Gmail (needs gmail.readonly)
  classify_replies: true        # LLM labels replies: interview / positive / referral / not_interested / OOO
  retry_on_bounce: true         # on bounce, mark address invalid and find the next best address
  no_response_after_days: 10

learning:
  enabled: true           # learn reply rates by sector / persona / resume variant / funding stage
  prior_reply_rate: 0.08
  prior_strength: 10
  min_samples: 5

# ──────────────────────────────────────────────────────────
# Prompt Customizations
# Available placeholders are shown in {braces}; unknown ones are left untouched.
# ──────────────────────────────────────────────────────────
prompts:
  company_research: |
    Analyze the company metadata and web scrape data for: {company_name}.
    Extract the following details:
    1. Business model & Product description
    2. Recent funding or launches
    3. Tech stack (languages, frameworks)
    4. Engineering culture & blog topics
    5. Key engineering/hiring leadership contacts.
    Format your response in structured markdown or JSON.

  resume_tailoring: |
    Given the job description for {role_name} at {company_name} and the base resume text:
    Base Resume Content:
    {base_resume_text}

    Job description:
    {job_description}

    Order projects and experience so the most relevant come first, in this priority:
    {highlights}

    Create a tailored version of the resume. Follow these guidelines:
    - Reorder sections and projects to highlight relevant experience first.
    - Rewrite bullet points (not just keywords) to emphasise existing work that matches the job requirements (e.g. {tech_stack}).
    - ONLY include or highlight technical skills and tools that are already present in the Base Resume.
    - DO NOT add any new languages, frameworks, databases, or tools to the tailored resume if they are not already in the Base Resume.
    - Improve wording and add relevant ATS keywords matching the job, but do not fabricate any projects, experience, or achievements. Ensure all information is 100% truthful and aligns with the Base Resume.
    - Keep valid Typst that compiles with the same imports as the Base Resume.
    - Output reasoning and the modifications list.

  email_generation: |
    Write a cold outreach email to {contact_name} ({contact_role}) at {company_name} about {role_name}.

    What I know about them (use only this, never invent facts):
    - Company: {company_description}
    - Product: {product_description}
    - Tech stack: {tech_stack}
    - Recent news / launches: {recent_news}
    - Job description: {job_description}
    - About {contact_name}: {contact_background}

    About me:
    - Relevant skills: {tailored_skills}
    - My highlights, most relevant first:
    {highlights}
    - My resume:
    {resume_summary}

    Recipient-specific guidelines: {persona_guidelines}
    Tone: {tone}.

    Rules:
    - Short, plain subject line (no clickbait).
    - Use only facts from the context above; if it is thin, write a simpler email instead of inventing details.
    - Mention the single most relevant experience from my resume (two at most), described by what I actually did.
    - State plainly that I am a student looking for an internship. Never imply full-time experience.
    - Sign off with my name ({user_name}); my LinkedIn/GitHub links are appended automatically.
    - No placeholders of any kind ("[Your Name]", "<Company>", etc.).
    (Voice, structure, persona-specific ask and anti-repetition rules are appended automatically by the platform.)

  # Optional: custom follow-up prompt (default is built in). Placeholders: {initial_email}, {followup_count},
  # {followup_1_days}, {followup_2_days}, plus everything available to email_generation.
  followup_generation: ""
